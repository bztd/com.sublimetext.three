app-id: com.sublimetext.three
command: sublime_text

runtime: org.freedesktop.Sdk
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

rename-desktop-file: sublime_text.desktop
rename-icon: sublime-text

separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --env=PATH=/app/utils/bin:/app/sublime_merge/bin:/app/bin:/usr/bin
  - --env=PYTHONPATH=/app/utils/lib/python3.9/site-packages

add-extensions:
  com.sublimetext.three.SublimeMerge:
    directory: sublime_merge
    add-ld-path: lib

  com.sublimetext.three.DevUtils:
    version: '24.08'
    directory: utils
    subdirectories: false
    add-ld-path: lib
    no-autodownload: true
    autodelete: true

modules:
  - name: extensions
    buildsystem: simple
    build-commands:
      - install -d /app/utils
      - install -d /app/sublime_merge
      
  - name: sublime
    buildsystem: simple
    build-commands:
      - mkdir -p /app/sublime
      - mkdir -p /app/bin
      - cp -r ./* /app/sublime/
      - ln -s /app/sublime/sublime_text /app/bin/sublime_text
      - install apply_extra /app/bin
      - install subl /app/bin/subl
      - install -Dm644 -t /app/share/applications/ ./sublime_text.desktop
      - install -Dm644 -t /app/share/appdata/ ./com.sublimetext.three.appdata.xml
      - install -Dm644 -t /app/share/icons/hicolor/256x256/apps ./Icon/256x256/sublime-text.png
  
    sources:
      - type: script
        dest-filename: subl
        commands:
          - PCFILE="Package Control.sublime-package"
          - PCLOCATION="$HOME/.var/app/com.sublimetext.three/config/sublime-text-3/Installed
            Packages"
          - |
            if ! test -f "$PCLOCATION/$PCFILE"; then
                mkdir -p "$PCLOCATION"
                cp "/app/extra/$PCFILE" "$PCLOCATION"
            fi
          - export LC_NUMERIC=C
          - exec /app/extra/sublime_text/sublime_text --fwdargv0 "$0" "$@"
      - type: archive
        url: https://download.sublimetext.com/sublime_text_build_4199_x64.tar.xz
        sha256: 36b870bfea31fd25b6d5cf3066db97f66cc743ea3d821b08e74754da40ef097d
        only-arches:
          - x86_64
      - type: archive
        url: https://download.sublimetext.com/sublime_text_build_4199_arm64.tar.xz
        sha256: def0978f9ddfd9096dfc06f784d36783e6380a1f390e9d06f2cad3541b5deb35 
        only-arches:
          - aarch64
      - type: extra-data
        filename: Package Control.sublime-package
        url: http://packagecontrol.io/Package%20Control.sublime-package
        sha256: 817937144c34c84c88cd43b85318b2656f9c3fac02f8f72cbc18360b2c26d139
        size: 471460
      - type: file
        path: com.sublimetext.three.desktop
      - type: file
        path: com.sublimetext.three.appdata.xml
      - type: file
        path: com.sublimetext.three-128.png
